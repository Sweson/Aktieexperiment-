name: Hourly AI Trade

# Kör en handelstur varje timme. Workflowet hämtar marknadsdata,
# sparar en snapshot och committar tillbaka. Själva köp/sälj-beslutet
# förväntas tas av en AI-runner (Claude Code/Anthropic API) som invokas
# i steget "AI decision" — om ANTHROPIC_API_KEY finns som secret.
# Annars körs bara snapshot + HOLD så att experimentet ändå tickar.

on:
  schedule:
    # Varje hel timme. cron är UTC.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot | hold | (lämna tom för auto)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: aktieexperiment-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/stock-trading-experiment-mlV67
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Take market snapshot
        id: snap
        run: |
          python -m src.turn snapshot | tee /tmp/snapshot.txt

      - name: AI decision (optional)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.ai_decide

      - name: Fallback HOLD (when no AI key)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.turn hold --reason "Auto-HOLD: ingen AI-runner konfigurerad"

      - name: Show report
        run: python -m src.turn report

      - name: Commit and push state
        run: |
          git config user.name  "ai-trader-bot"
          git config user.email "ai-trader-bot@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "Inga ändringar att committa."
          else
            TURN=$(python -c "import json; print(json.load(open('data/portfolio.json'))['turn_count'])")
            git commit -m "tur #${TURN} - automatisk handelstur"
            git push origin claude/stock-trading-experiment-mlV67
          fi
