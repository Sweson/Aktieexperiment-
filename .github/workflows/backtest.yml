name: Backtest 30d

# Kör en backtest av strategin på de senaste 30 dagarnas verkliga
# Yahoo-data och committar resultatet under data/backtest/.
#
# Triggas:
# - manuellt (workflow_dispatch)
# - automatiskt vid push av filer som påverkar backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Antal dagar att backtesta"
        required: false
        default: "30"
      source:
        description: "yahoo (riktig data) eller synthetic (offline)"
        required: false
        default: "yahoo"
      seed:
        description: "Seed för synthetic-källan"
        required: false
        default: "42"
  push:
    branches:
      - claude/stock-trading-experiment-mlV67
    paths:
      - "src/backtest.py"
      - "config.yaml"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: aktieexperiment-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-trading-experiment-mlV67
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          DAYS="${{ github.event.inputs.days }}"
          SOURCE="${{ github.event.inputs.source }}"
          SEED="${{ github.event.inputs.seed }}"
          DAYS=${DAYS:-30}
          SOURCE=${SOURCE:-yahoo}
          SEED=${SEED:-42}
          python -m src.backtest --days "$DAYS" --source "$SOURCE" --seed "$SEED"

      - name: Commit results
        run: |
          git config user.name  "ai-trader-bot"
          git config user.email "ai-trader-bot@users.noreply.github.com"
          git add data/backtest/ || true
          if git diff --cached --quiet; then
            echo "Inga ändringar att committa."
          else
            git commit -m "backtest: uppdaterat resultat ($(date -u +%Y-%m-%d))"
            git push origin claude/stock-trading-experiment-mlV67
          fi
