title = "ÖvningsHub Sverige gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "ovh-bankid-private-key"
description = "BankID test certificate or private key"
regex = '''-----BEGIN (RSA |EC )?PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "ovh-jwt-signing-secret"
description = "JWT signing secret in source"
regex = '''(?i)(jwt[_-]?secret|signing[_-]?key)\s*[:=]\s*['"][A-Za-z0-9+/=]{16,}['"]'''
tags = ["secret", "jwt"]

[allowlist]
description = "Test fixtures and dummy values"
paths = [
  '''.*\.test\.ts''',
  '''.*/__fixtures__/.*''',
  '''\.env\.example''',
]
regexes = [
  '''dummy''',
  '''DUMMY''',
  '''example''',
  '''placeholder''',
]
