# Aktieexperiment - konfiguration
# Alla regler för AI-tradern finns här

experiment:
  name: "AI Aktieexperiment"
  starting_capital_sek: 10000.00
  currency: "SEK"
  goal: "Maximera vinst på kortast möjliga tid"

# Handelsregler
rules:
  # Inga blankningar, ingen belåning
  allow_short: false
  allow_margin: false
  # Inga fraktionerade aktier
  fractional_shares: false
  # Realistisk courtage (Avanza Mini ~ 0.25%, min 1 SEK)
  fee_pct: 0.0025
  fee_min_sek: 1.00
  # Riskhantering
  max_position_pct: 0.30   # Max 30% av portföljvärde i en enskild aktie
  min_cash_pct: 0.00       # Får gå all-in om AI vill
  # En "tur" per timme
  turn_interval_minutes: 60

